# Local development infrastructure (build guide Step 1.4).
# Start:  docker compose up -d     Stop:  docker compose down     Reset data:  docker compose down -v
# Requires a .env file next to this one: copy .env.example to .env.
name: chatlium

services:
  postgres:
    # PostgreSQL 18.6 with pgvector 0.8.7. Pinned by tag and digest.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: not reachable from other machines on the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  floci:
    # Local AWS emulator (Cognito and S3 now; SQS, Secrets Manager and KMS later). Pinned by digest.
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      # Keep the user pool (and its ID in .env) across restarts.
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      # Verify SigV4 signatures like AWS does (off by default in Floci). Without it, a presigned S3
      # URL edited to another key, size or content type is accepted (found in Step 2.2).
      FLOCI_AUTH_VALIDATE_SIGNATURES: 'true'
      # FLOCI_HOSTNAME is left unset: in Phase 1 the browser and the Next.js dev server both reach
      # Floci on localhost:4566, so the Cognito issuer URL is the same for both. Revisit in Phase 3
      # when the web app runs in a container (see the version research notes).
    ports:
      - '127.0.0.1:${FLOCI_PORT:-4566}:4566'
    volumes:
      # No Docker socket: Cognito, SQS, S3, Secrets Manager and KMS run inside Floci's own process.
      - floci-data:/app/data
    healthcheck:
      # The image has bash but no curl, so check the port with bash's /dev/tcp.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/4566']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  floci-data:
