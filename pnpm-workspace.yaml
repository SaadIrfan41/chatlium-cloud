packages:
  - 'apps/*'
  - 'packages/*'

# Install scripts are denied unless a package is proven to need one (supply-chain policy, see build log 1.5).
allowBuilds:
  # esbuild ships prebuilt platform binaries as optional dependencies; its postinstall only verifies them.
  esbuild: false
  # Native SSH support for Testcontainers' Docker client. Not used: Docker is local, not reached over SSH.
  ssh2: false
  cpu-features: false
  # Version-check script only.
  protobufjs: false

# Optional dependencies that are never installed.
ignoredOptionalDependencies:
  # pdf.js uses a native canvas only to render pages to images. Text extraction (build guide 2.3)
  # never renders, so the native binary stays out.
  - '@napi-rs/canvas'
